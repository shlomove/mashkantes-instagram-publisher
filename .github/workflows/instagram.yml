name: Instagram daily publisher
on:
  workflow_dispatch:
  push:
    paths:
      - 'content/**'
  schedule:
    - cron: '7,37 12-15 * * 0-4'
permissions:
  contents: write
concurrency:
  group: instagram-daily
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install renderer
        run: python -m pip install Pillow==11.3.0 python-bidi==0.6.7
      - name: Verify code
        run: python -m unittest -v test_publisher test_cloud
      - name: Verify cloud rendering and public media without Instagram publication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python smoke.py
      - name: Prepare and publish approved content
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_PUBLICATION_ENABLED: ${{ vars.IG_PUBLICATION_ENABLED }}
        run: python cloud_runner.py
